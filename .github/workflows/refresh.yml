name: Refresh live subscription

on:
  schedule:
    - cron: '23 22 * * *' # 06:23 Asia/Shanghai the following day
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: 'Refresh upstream sources; disable only to publish a reviewed snapshot'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/refresh.yml'

concurrency:
  group: refresh-live-subscription
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test merge and failure protections
        run: node --test
      - name: Fetch, probe, merge and validate
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_sources
        run: node src/update.mjs
      - name: Validate the snapshot before publishing
        run: >-
          node --input-type=module -e "import fs from 'node:fs'; import { validateOutput } from './src/merge.mjs'; const read = p => JSON.parse(fs.readFileSync(p, 'utf8')); validateOutput(read('docs/channels.json'), read('config/seed-channels.json'), read('config/sources.json')); console.log('Channel identities, protected regions, fallbacks and URL restrictions passed');"
      - name: Generate M3U playlist from JSON
        run: >-
          node --input-type=module -e "
            import fs from 'node:fs';
            const data = JSON.parse(fs.readFileSync('docs/channels.json', 'utf8'));
            let m3u = '#EXTM3U\n';
            for (const group of (data.groups || data)) {
              const groupName = group.name || '默认分组';
              for (const channel of (group.channels || [])) {
                const name = channel.name;
                for (const url of (channel.urls || [])) {
                  m3u += \`#EXTINF:-1 group-title=\"\${groupName}\",\${name}\n\${url}\n\`;
                }
              }
            }
            fs.writeFileSync('docs/tv.m3u', m3u, 'utf8');
            console.log('Successfully generated docs/tv.m3u');
          "
      - name: Preserve generated snapshot and daily report
        run: |
          git config user.name 'AlexF'
          git config user.email 'AlexF@local.com'
          git add docs/channels.json docs/report.json docs/tv.m3u
          if ! git diff --cached --quiet; then
            git commit -m '同步央视卫视线路并自动生成兼容 TVBox 的 m3u 订阅文件'
            git push origin HEAD:main
          fi
      - name: Upload validated Pages content
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated subscription
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
