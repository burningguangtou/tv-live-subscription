- name: Generate M3U playlist from JSON
        run: >-
          node --input-type=module -e "
            import fs from 'node:fs';
            const raw = JSON.parse(fs.readFileSync('docs/channels.json', 'utf8'));
            console.log('JSON structure keys:', Object.keys(raw));
            let m3u = '#EXTM3U\n';
            
            // 兼容不同的 JSON 顶层结构（数组或包含对象的结构）
            const items = Array.isArray(raw) ? raw : (raw.groups || raw.channels || Object.values(raw));
            
            for (const group of items) {
              const groupName = group.name || group.group || '默认分组';
              const channels = group.channels || group.item || (Array.isArray(group) ? group : []);
              for (const channel of channels) {
                const name = channel.name || channel.title;
                const urls = channel.urls || (channel.url ? [channel.url] : []);
                for (const url of urls) {
                  if (name && url) {
                    m3u += \`#EXTINF:-1 group-title=\"\${groupName}\",\${name}\n\${url}\n\`;
                  }
                }
              }
            }
            fs.writeFileSync('docs/tv.m3u', m3u, 'utf8');
            console.log('Successfully generated docs/tv.m3u with content length:', m3u.length);
          "
